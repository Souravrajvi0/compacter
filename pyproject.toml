[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compacter-agent"
version = "2.2.0"
description = "Agent-agnostic, policy-based context control for CLI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "context", "compaction", "claude-code", "codex", "opencode", "coding-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["tiktoken>=0.7", "pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Souravrajvi0/compacter"
Issues = "https://github.com/Souravrajvi0/compacter/issues"
Changelog = "https://github.com/Souravrajvi0/compacter/blob/main/CHANGELOG.md"

[project.scripts]
compacter = "compacter.cli:main"
ctxpipe = "compacter.cli:main"  # old name, so existing hooks and plugins keep working

[tool.hatch.build.targets.wheel]
packages = ["src/compacter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
