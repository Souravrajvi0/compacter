[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxpipe"
version = "2.1.1"
description = "Agent-agnostic, policy-based context control for CLI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tiktoken>=0.7"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ctxpipe = "ctxpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
