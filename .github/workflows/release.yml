name: Release

# Publishes to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a "trusted publisher" for this repo
# (workflow: release.yml, environment: pypi). No API token is stored anywhere.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build -e ".[dev]"
      - run: pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
